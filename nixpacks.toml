# Monorepo: only install/build the TS client + Next app (skip root Anchor dev deps).
[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = [
  "npm install --prefix clients/ts/ledgerline --no-audit --no-fund",
  "npm install --prefix app --no-audit --no-fund",
]

[phases.build]
cmds = ["npm run build --prefix app"]

[start]
cmd = "npm run start --prefix app"
