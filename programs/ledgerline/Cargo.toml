[package]
name = "ledgerline"
version = "0.1.0"
description = "Stock-backed credit lines on Solana, repaid by dividends"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ledgerline"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.2", features = ["init-if-needed"] }
anchor-spl = "0.32.2"

