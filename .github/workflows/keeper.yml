# Keeper tick every 15 minutes. The keypair and the keeper config JSON both
# come from Actions secrets. Without them the job still runs the offline selftest.
name: keeper-tick
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: install keeper (Kit client)
        working-directory: keeper
        run: npm install --no-audit --no-fund
      - name: keeper selftest (no network)
        working-directory: keeper
        run: npm run keeper:selftest
      - name: one config keeper tick (devnet)
        env:
          KEEPER_SECRET: ${{ secrets.KEEPER_KEYPAIR_JSON }}
          KEEPER_CONFIG_JSON: ${{ secrets.KEEPER_CONFIG_JSON }}
        run: |
          if [ -z "$KEEPER_SECRET" ] || [ -z "$KEEPER_CONFIG_JSON" ]; then
            echo "KEEPER_SECRET or KEEPER_CONFIG_JSON is not set — skipping devnet tick"
            exit 0
          fi
          mkdir -p .anchor
          echo "$KEEPER_SECRET" > .anchor/demo-keypair.json
          echo "$KEEPER_CONFIG_JSON" > keeper/config.devnet.json
          cd keeper && npx tsx src/cli.ts --config config.devnet.json --loop 1 5
